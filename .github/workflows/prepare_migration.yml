name: pdf-to-text

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - legacy/*.pdf
      - legacy/*.PDF

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf==6.6.2

      - name: Extract text from legacy pdf
        run: |
          python scripts/extract_pdf_text.py legacy legacy/source.txt

      - name: Show preview
        run: |
          echo "First 80 lines of extracted text:"
          head -n 80 legacy/source.txt || true

      - name: Commit extracted text
        run: |
          set -euo pipefail

          branch_name="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy/source.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Prepare migration: extract text from legacy PDF"
          git fetch origin "$branch_name"
          git rebase "origin/$branch_name"
          git push origin "HEAD:$branch_name"

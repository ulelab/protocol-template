name: Prepare migration from PDF

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - legacy/*.pdf
      - legacy/*.PDF

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Extract text from legacy pdf
        run: |
          python scripts/extract_pdf_text.py legacy legacy/source.txt

      - name: Show preview
        run: |
          echo "First 80 lines of extracted text:"
          head -n 80 legacy/source.txt || true

      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy/source.txt
          git diff --cached --quiet || git commit -m "Prepare migration: extract text from legacy PDF"
          git push

name: pdf-to-markdown

on:
  workflow_dispatch:
    inputs:
      pdf_name:
        description: "PDF file name inside legacy/ (example: report.pdf)"
        required: true
        default: "input.pdf"
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    env:
      LEGACY_DIR: legacy

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install fast-mode dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pymupdf4llm

      - name: Convert PDF to legacy/source.md
        run: |
          set -eux

          PDF="$LEGACY_DIR/${{ inputs.pdf_name }}"
          OUT="$LEGACY_DIR/source.md"

          test -d "$LEGACY_DIR"
          test -f "$PDF"

          python scripts/pdf_to_md.py "$PDF" "$OUT"

      - name: Show generated files
        run: |
          find "$LEGACY_DIR" -maxdepth 3 \( -name "source.md" -o -path "$LEGACY_DIR/images/*" \) | sort

      - name: Commit and push generated files
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$LEGACY_DIR/source.md"
          if [ -d "$LEGACY_DIR/images" ]; then
            git add "$LEGACY_DIR/images"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update legacy/source.md from ${{ inputs.pdf_name }}"
          git push